[package]
name = "academic-routine"
version = "0.1.0"
edition = "2021"
authors = ["Mir Zaheen Waseet <zwaseet@gmail.com>"]
description = "A fast academic schedule engine, .ics calendar synchronizer, and Telegram assistant"
license = "MIT"

[lib]
name = "academic_routine"
path = "src/lib.rs"

[[bin]]
name = "academic-routine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4.45", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"
