[package]
name = "academic-routine"
version = "0.3.2"
edition = "2021"
rust-version = "1.89"
authors = ["Mir Zaheen Waseet <zwaseet@gmail.com>"]
description = "A fast academic schedule engine, .ics calendar synchronizer, and Telegram assistant"
license = "MIT"

[lib]
name = "academic_routine"
path = "src/lib.rs"

[[bin]]
name = "academic-routine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
comfy-table = "8.0"
crossterm = "0.29"
colored = "3.1"
teloxide = { version = "0.17", features = ["macros"] }
tokio = { version = "1.40", features = ["full"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
